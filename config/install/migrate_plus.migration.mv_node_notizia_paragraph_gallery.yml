langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_node_notizia_paragraph_gallery
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - node_paragraphs
  - node_paragraphs_gallery
  - node_paragraphs_gallery_item
migration_group: mv_paragraphs
label: 'Paragrafo node gallery'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_notizia_paragraph_gallery.json'
  item_selector: 0
  fields:
    - name: migration_id
      label: 'ID del nodo associato per riferimento migration_lookup'
      selector: migration_id
    - name: field_overlay
      label: "Se è attivo o meno l'overlay"
      selector: field_overlay
    - name: field_gallery_grid_type
      label: "Il tipo di griglia"
      selector: field_gallery_grid_type
    - name: field_gallery_item
      label: "I paragrafi gallery_item associati"
      selector: field_gallery_item
    - name: field_show_caption
      label: "Se la descrizione deve essere visualizzata"
      selector: field_show_caption
    - name: langcode
      label: "La lingua dell'immagine"
      selector: langcode
    - name: created
      label: "La data di invio del contenuto"
      selector: created
  ids:
    migration_id:
      type: string

process:
  #id: id
  field_overlay: field_overlay
  field_gallery_grid_type: field_gallery_grid_type
  _gallery_item:
    - plugin: explode
      source: field_gallery_item
      delimiter: ";"
    - plugin: migration_lookup
      migration: mv_node_notizia_paragraph_gallery_item
      source: migration_id
  field_gallery_item:
    - plugin: sub_process
      source:
        - '@_gallery_item'
      process:
        target_id: '0'
        target_revision_id: '1'
  field_show_caption: field_show_caption

  # langcode: -> shared_configuration
  # promote: -> shared_configuration
  # sticky: -> shared_configuration
  status:
    plugin: default_value
    source: status
    default_value: 0
  # created: -> shared_configuration

destination:
  plugin: 'entity_reference_revisions:paragraph'
  default_bundle: gallery
migration_dependencies:
  required:
    - mv_node_notizia_paragraph_gallery_item
