langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_media_video
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - media
migration_group: mv_files
label: 'Importa i video remoti degli articoli e notizie da icmarvasivizzone.edu.it'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_notizia_paragraph_video.json'
  item_selector: 0
  fields:
    - name: migration_id
      label: 'ID di riferimento migrazione'
      selector: migration_id
    - name: uid
      label: "ID dell'utente proprietario"
      selector: uid
    - name: bundle
      label: 'Il tipo di media'
      selector: bundle
    - name: name
      label: 'Il nome del media'
      selector: title
    - name: field_video_url
      label: "L'url del media"
      selector: field_video_url
    - name: langcode
      label: "La lingua"
      selector: langcode
    - name: status
      label: "Lo stato"
      selector: status
    - name: created
      label: "La data di creazione"
      selector: created
  ids:
    migration_id:
      type: string

process:
  #mid: mid
  uid: uid
  bundle: bundle
  name: name
  field_media_oembed_video: field_video_url
  field_trascrizione: name
  langcode:
    plugin: default_value
    source: language
    default_value: 'it'
  status:
    plugin: default_value
    source: published
    default_value: 1
  created:
    - plugin: skip_on_empty
      source: created
      method: process

destination:
  plugin: 'entity:media'
  translations: true
migration_dependencies:
  required:
    - mv_user
