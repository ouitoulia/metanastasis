langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_node_notizia_gallery_items
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - node_paragraphs
  - node_paragraphs_items
migration_group: mv_nodes
label: 'Paragrafo gallery item'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_notizia.json'
  item_selector: 0
  fields:
    -
      name: nid
      label: 'ID del nodo associato per riferimento migration_lookup'
      selector: migration_id
    -
      name: uuid
      label: 'uuid del nodo associato per riferimento migration_lookup'
      selector: uuid
    -
      name: fid
      label: "Il riferimento all'immagine"
      selector: field_paragraph_gallery
    -
      name: language
      label: 'La lingua del contenuto'
      selector: langcode
  ids:
    nid:
      type: string
    uuid:
      type: string
process:
  #id: id
  field_gallery_item:
    - plugin: skip_on_empty
      source: field_paragraph_gallery
      method: process
    - plugin: log



  langcode:
    plugin: default_value
    source: language
    default_value: 'it'
destination:
  plugin: 'entity_reference_revisions:paragraph'
  default_bundle: gallery
migration_dependencies: { }
