langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_node_documento
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - node
  - node_documento
migration_group: mv_nodes
label: 'Tipo di contenuto documento'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_documento.json'
  item_selector: 0
  fields:
    - name: migration_id
      label: "L'id del nodo da usare come riferimento di migrazione"
      selector: migration_id
    - name: uuid
      label: "L'uuid per riferimenti"
      selector: uuid
    - name: uid
      label: "L'utente proprietario"
      selector: uid
    - name: type
      label: "Il tipo"
      selector: type
    - name: title
      label: "Il titolo"
      selector: title

    - name: field_abstract
      label: "L'abstract"
      selector: field_abstract
    - name: field_argomenti
      label: "Gli argomenti"
      selector: field_argomenti
    - name: body_value
      label: "Il campo body"
      selector: body_value
    - name: field_tipologia_documento
      label: "La tipologia del documento"
      selector: field_tipologia_documento
    - name: field_copertina
      label: "L'immagine di copertina"
      selector: field_copertina
    - name: field_galleria_immagini
      label: "Galleria immagini"
      selector: field_galleria_immagini
    - name: field_persone
      label: "Le persone citate nei documenti"
      selector: field_persone
    - name: field_allegati
      label: "Gli allegati al tipo documento"
      selector: field_allegati
    - name: field_link
      label: "Eventuali link a normativa"
      selector: field_link
    - name: field_protocollo
      label: "Il numero di protocollo"
      selector: field_protocollo
    - name: field_data_inizio
      label: "La data di protocollazione"
      selector: field_data_inizio
    - name: field_cig
      label: "Il codice CIG"
      selector: field_cig
    - name: field_data_fine
      label: "L'eventuale data di scadenza"
      selector: field_data_fine
    - name: field_cup
      label: "Il codice CUP"
      selector: field_cup
    - name: field_codice_identificativo
      label: "Il codice identificativo del documento"
      selector: field_codice_identificativo
    - name: field_data_oblio
      label: "La data di oblio"
      selector: field_data_oblio
    - name: field_anno_scolastico
      label: "L'anno scolastico della pubblicazione"
      selector: field_anno_scolastico
    - name: field_servizio
      label: "Servizi associati"
      selector: field_servizio
    - name: field_eventi
      label: "Eventi associati"
      selector: field_eventi
    - name: field_progetti
      label: "Progetti associati"
      selector: field_progetti
    - name: field_percorso_di_studio
      label: "Percorsi di studio associati"
      selector: field_percorso_di_studio
    - name: field_notizie
      label: "Notizie associate"
      selector: field_notizie
    - name: field_classi
      label: "Classi associate"
      selector: field_classi
    - name: field_finanziamenti
      label: "Finanziamenti associati"
      selector: field_finanziamenti
    - name: field_frequenza
      label: "La frequenza di aggiornamento del documento"
      selector: field_frequenza
    - name: field_struttura_responsabile
      label: "La struttura responsabile del documento"
      selector: field_struttura_responsabile
    - name: field_tipologia_licenza
      label: "La tipologia di licenza"
      selector: field_tipologia_licenza
    - name: field_timeline
      label: "Eventuale timeline"
      selector: field_timeline
    - name: field_extra_info
      label: "Ulteriori informazioni"
      selector: field_extra_info
    - name: field_obbligo_di_pubblicazione
      label: "L'obbligo di pubblicazione che il documento soddisfa"
      selector: field_obbligo_di_pubblicazione

    - name: langcode
      label: "La lingua del contenuto"
      selector: langcode
    - name: promote
      label: "Flag promote"
      selector: promote
    - name: sticky
      label: "Flag sticky"
      selector: sticky
    - name: status
      label: "Lo stato del nodo"
      selector: status
    - name: created
      label: "La data di creazione"
      selector: created
    - name: changed
      label: "La data di aggiornamento"
      selector: changed

  ids:
    migration_id:
      type: string
    uuid:
      type: string

process:
  #nid: nid
  uid: uid
  type: type
  title: title

  # field_abstract: -> shared_configuration
  # field_argomenti: -> field_argomenti
  # body/value: -> shared_configuration
  field_tipologia_documento:
    - plugin: skip_on_empty
      source: field_tipologia_documento
      method: process
  # field_copertina: -> shared_configuration
  field_galleria_immagini:
    plugin: skip_on_empty
    source: field_galleria_immagini
    method: process
  # field_persone: -> shared_configuration
  field_allegati:
    - plugin: skip_on_empty
      source: field_allegati
      method: process
    - plugin: sub_process
      source: field_allegati
      process:
        target_id:
          - plugin: migration_lookup
            source: migration_target_id
            migration: mv_file
            source_ids: migration_fid
          - plugin: callback
            callable: reset
        description:
          - plugin: skip_on_empty
            source: description
            method: process
        langcode: langcode
  field_link:
    - plugin: skip_on_empty
      source: field_link
      method: process
  field_protocollo:
    - plugin: skip_on_empty
      source: field_protocollo
      method: process
  field_data_inizio:
    - plugin: skip_on_empty
      source: field_data_inizio
      method: process
  field_cig:
    - plugin: skip_on_empty
      source: field_cig
      method: process
  field_data_fine:
    - plugin: skip_on_empty
      source: field_data_fine
      method: process
  field_cup:
    - plugin: skip_on_empty
      source: field_cup
      method: process
  field_codice_identificativo:
    - plugin: skip_on_empty
      source: field_codice_identificativo
      method: process
  field_data_oblio:
    - plugin: skip_on_empty
      source: field_data_oblio
      method: process
  field_anno_scolastico:
    - plugin: skip_on_empty
      source: field_anno_scolastico
      method: process
    - plugin: static_map
      source: field_anno_scolastico
      bypass: false
      map:
        "2010_2011": 1
        "2011_2012": 2
        "2012_2013": 3
        "2013_2014": 4
        "2014_2015": 5
        "2015_2016": 6
        "2016_2017": 7
        "2017_2018": 8
        "2018_2019": 9
        "2019_2020": 10
        "2020_2021": 11
        "2021_2022": 12
        "2022_2023": 13
        "2023_2024": 14
        "2024_2025": 15
  field_servizio:
    - plugin: skip_on_empty
      source: field_servizio
      method: process
  field_eventi:
    - plugin: skip_on_empty
      source: field_eventi
      method: process
  field_progetti:
    - plugin: skip_on_empty
      source: field_progetti
      method: process
  field_percorso_di_studio:
    - plugin: skip_on_empty
      source: field_percorso_di_studio
      method: process
  field_notizie:
    - plugin: skip_on_empty
      source: field_notizie
      method: process
  field_classi:
    - plugin: skip_on_empty
      source: field_classi
      method: process
  field_finanziamenti:
    - plugin: skip_on_empty
      source: field_finanziamenti
      method: process
    - plugin: explode
      source: field_finanziamenti
      delimiter: ";"
    - plugin: migration_lookup
      migration:
        - mv_node_finanziamento
      source_ids: migration_id
    - plugin: callback
      callable: reset
  field_frequenza:
    - plugin: skip_on_empty
      source: field_frequenza
      method: process
  field_struttura_responsabile:
    - plugin: skip_on_empty
      source: field_struttura_responsabile
      method: process
  field_tipologia_licenza:
    - plugin: skip_on_empty
      source: field_tipologia_licenza
      method: process
  field_timeline:
    - plugin: skip_on_empty
      source: field_timeline
      method: process
  _extra_info_items:
    - plugin: skip_on_empty
      source: field_extra_info
      method: process
    - plugin: explode
      source: field_extra_info
      delimiter: ";"
    - plugin: migration_lookup
      migration:
        - mv_node_notizia_paragraph_gallery
        - mv_node_notizia_paragraph_attachments
        - mv_node_notizia_paragraph_video
      source_ids: migration_id
  field_extra_info:
    - plugin: sub_process
      source: '@_extra_info_items'
      process:
        target_id: '0'
        target_revision_id: '1'

  field_obbligo_di_pubblicazione:
    - plugin: skip_on_empty
      source: field_obbligo_di_pubblicazione
      method: process
    - plugin: explode
      source: field_destinatari
      delimiter: ";"
