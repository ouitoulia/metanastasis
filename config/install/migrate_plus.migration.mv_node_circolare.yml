langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_node_circolare
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - node
  - node_circolare
migration_group: mv_nodes
label: 'Tipo di contenuto circolare'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_circolare.json'
  item_selector: 0
  fields:
    - name: migration_id
      label: "L'id del nodo da usare come riferimento di migrazione"
      selector: migration_id
    - name: uuid
      label: "L'uuid per riferimenti"
      selector: uuid
    - name: uid
      label: "L'utente proprietario"
      selector: uid
    - name: type
      label: "Il tipo"
      selector: type
    - name: title
      label: "Il titolo"
      selector: title

    - name: field_numero_circolare
      label: "Il numero della circolare"
      selector: field_numero_circolare
    - name: field_anno_scolastico
      label: "L'anno scolastico di riferimento"
      selector: field_anno_scolastico
    - name: field_abstract
      label: "L'abstract"
      selector: field_abstract
    - name: field_argomenti
      label: "Gli argomenti"
      selector: field_argomenti
    - name: field_destinatari
      label: "I destinatari della circolare"
      selector: field_destinatari
    - name: field_data_oblio
      label: "La data di oblio"
      selector: field_data_oblio
    - name: field_allegati
      label: "Gli allegati alla circolare"
      selector: field_allegati
    - name: field_link
      label: "Gli eventuali link"
      selector: field_link
    - name: field_eventi
      label: "Gli eventi correlati"
      selector: field_eventi
    - name: body_value
      label: "Il campo body"
      selector: body_value
    - name: field_persona_responsabile
      label: "La persona responsabile"
      selector: field_persona_responsabile
    - name: field_protocollo
      label: "Il protocollo della circolare"
      selector: field_protocollo
    - name: field_cig
      label: "Eventuale cig"
      selector: field_cig
    - name: field_cup
      label: "Eventuale cup"
      selector: field_cup
    - name: field_data_scadenza
      label: "La data di scadenza"
      selector: field_data_scadenza
    - name: amministrazione_trasparente
      label: "Il collegamento ad amministrazione trasparente"
      selector: amministrazione_trasparente

    - name: langcode
      label: "La lingua dell'utente"
      selector: langcode
    - name: promote
      label: "Flag promote"
      selector: promote
    - name: sticky
      label: "Flag sticky"
      selector: sticky
    - name: status
      label: "Lo stato del nodo"
      selector: status
    - name: created
      label: "La data di creazione"
      selector: created
    - name: changed
      label: "La data di aggiornamento"
      selector: changed

  ids:
    migration_id:
      type: string
    uuid:
      type: string

process:
  #nid: nid
  uid: uid
  type: type
  title: title

  field_numero_circolare:
    - plugin: skip_on_empty
      source: field_numero_circolare
      method: process
  field_anno_scolastico:
    - plugin: static_map
      source: field_anno_scolastico
      bypass: false
      map:
        "2010_2011": 1
        "2011_2012": 2
        "2012_2013": 3
        "2013_2014": 4
        "2014_2015": 5
        "2015_2016": 6
        "2016_2017": 7
        "2017_2018": 8
        "2018_2019": 9
        "2019_2020": 10
        "2020_2021": 11
        "2021_2022": 12
        "2022_2023": 13
        "2023_2024": 14
        "2024_2025": 15
  # field_abstract: -> shared_configuration
  # field_argomenti: -> field_argomenti
  field_destinatari:
    - plugin: skip_on_empty
      source: field_destinatari
      method: process
    - plugin: explode
      source: field_destinatari
      delimiter: ";"
    - plugin: callback
      callable: intval
    - plugin: static_map
      bypass: false
      map:
        27: 403 # Docenti
        28: 402 # ATA
        29: 405 # Genitori
        30: 401 # Alunni
  field_data_oblio:
    - plugin: skip_on_empty
      source: field_data_oblio
      method: process
  field_allegati:
    - plugin: sub_process
      source: field_allegati
      process:
        target_id:
          - plugin: migration_lookup
            source: migration_target_id
            migration: mv_file
            source_ids: migration_fid
          - plugin: callback
            callable: reset
        description:
          - plugin: skip_on_empty
            source: description
            method: process
        langcode: langcode
  field_link:
    - plugin: skip_on_empty
      source: field_link
      method: process
  field_eventi:
    - plugin: skip_on_empty
      source: field_eventi
      method: process
  # body/value: -> shared_configuration
  # field_persona_responsabile: -> shared_configuration
  field_protocollo:
    - plugin: skip_on_empty
      source: field_protocollo
      method: process
  field_cig:
    - plugin: skip_on_empty
      source: field_cig
      method: process
  field_cup:
    - plugin: skip_on_empty
      source: field_cup
      method: process
  field_data_scadenza:
    - plugin: skip_on_empty
      source: field_data_scadenza
      method: process

  # langcode: -> shared_configuration
  # promote: -> shared_configuration
  # sticky: -> shared_configuration
  status:
    plugin: default_value
    source: status
    default_value: 1
  # created: -> shared_configuration

destination:
  plugin: 'entity:node'
  default_bundle: circolare
  translations: true

migration_dependencies:
  required:
    - taxonomy_common_uuid
    - amministrazione_trasparente_categorie
    - amministrazione_trasparente_obblighi
    - mv_user
    - mv_taxonomy_argomenti
    - mv_file
    - mv_media
    - mv_node_persona
    - mv_struttura_organizzativa
