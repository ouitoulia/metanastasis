langcode: it
status: true
dependencies:
  enforced:
    module:
      - marvasi_migration
id: marvasi_node_persona
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - marvasi
  - node
  - node_persona
migration_group: marvasi_node
label: 'Tipo di contenuto Persona'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=0'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=1'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=2'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=3'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=4'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=5'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=6'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=7'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=8'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=9'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=10'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=11'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=12'
  item_selector: data
  fields:
    -
      name: uuid
      label: "L'uuid json:api"
      selector: id
    -
      name: nid
      label: "L'id dell'utente usato come riferimento per le associazioni"
      selector: attributes/drupal_internal__uid
    -
      name: name
      label: "L'username per relazioni"
      selector: attributes/name

    - name: field_nome
      label: "Il nome"
      selector: attributes/field_nome
    - name: field_cognome
      label: "Il cognome"
      selector: attributes/field_cognome
    - name: field_codice_fiscale
      label: "Il codice fiscale"
      selector: attributes/field_codice_fiscale
    - name: field_data_di_nascita
      label: "La data di nascita"
      selector: attributes/field_data_di_nascita

    - name: created
      label: "La data di creazione"
      selector: attributes/created
    - name: changed
      label: "La data di aggiornamento"
      selector: attributes/changed

  ids:
    uuid:
      type: string
    nid:
      type: integer
    name:
      type: string

#  constants:
#    ritratto_path: 'public://demo/persona/ritratto/'
process:
  nid: nid
  uid:
    plugin: default_value
    source: nid
    default_value: 1
  type:
    plugin: default_value
    default_value: "persona"
  title:
    - plugin: concat
      source:
        - field_nome
        - field_cognome
      delimiter: " "
  field_nome: field_nome
  field_cognome: field_cognome
  field_abstract:
    - plugin: concat
      source:
        - 'Profilo di:'
        - field_nome
        - field_cognome
      delimiter: " "
  field_data_nascita:
    plugin: skip_on_empty
    source: field_data_di_nascita
    method: process
  field_codice_fiscale:
    plugin: skip_on_empty
    source: field_codice_fiscale
    method: process
  langcode:
    plugin: default_value
    source: language
    default_value: 'it'
  promote:
    plugin: default_value
    source: promote
    default_value: 0
  sticky:
    plugin: default_value
    source: sticky
    default_value: 0
  status:
    plugin: default_value
    source: published
    default_value: 1
  created:
    - plugin: skip_on_empty
      source: created
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: created
  changed:
    - plugin: skip_on_empty
      source: changed
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: changed
destination:
  plugin: 'entity:node'
  default_bundle: persona
  translations: true
migration_dependencies:
  required:
    - marvasi_users
