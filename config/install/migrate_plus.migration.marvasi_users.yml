langcode: it
status: true
dependencies:
  enforced:
    module:
      - marvasi_migration
id: marvasi_users
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - marvasi
  - users
migration_group: marvasi_user
label: 'Account delle persone'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  #  Authorization: 'Basic LWggYWRtaW46Y3pOaTZMa3RKego='
  # This configuration is provided by the `basic` authentication plugin.
  # Credentials should never be saved in plain text nor committed to the repo.
#  authentication:
#    plugin: basic
#    username: admin
#    password: czNi6LktJz
  urls:
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=0'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=1'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=2'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=3'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=4'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=5'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=6'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=7'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=8'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=9'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=10'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=11'
    - 'https://sync.icmarvasivizzone.edu.it/it/jsonapi/views/0_export_user/page_1?page=12'
  item_selector: data
  fields:
    - name: uuid
      label: "L'id dell'utente"
      selector: id
    - name: display_name
      label: "Il nome visualizzato dell'utente"
      selector: attributes/display_name
    - name: uid
      label: "L'id dell'utente"
      selector: attributes/drupal_internal__uid
    - name: langcode
      label: "La lingua"
      selector: attributes/langcode
    - name: preferred_langcode
      label: "La lingua preferita"
      selector: attributes/preferred_langcode
    - name: preferred_admin_langcode
      label: "La lingua preferita di default"
      selector: attributes/preferred_admin_langcode

    - name: name
      label: "L'username"
      selector: attributes/name
    - name: mail
      label: "La mail"
      selector: attributes/mail
    - name: timezone
      label: "Il fuso orario"
      selector: attributes/timezone
    - name: status
      label: "Lo stato dell'utente"
      selector: attributes/status
    - name: created
      label: "La data di creazione"
      selector: attributes/created
    - name: changed
      label: "La data di aggiornamento"
      selector: attributes/changed
    - name: access
      label: "La data dell'ultimo accesso"
      selector: attributes/access
    - name: login
      label: "La data di login"
      selector: attributes/login
    - name: init
      label: "L'indirizzo email di registrazione"
      selector: attributes/init

    - name: default_langcode
      label: "Se usa il default langcode"
      selector: attributes/default_langcode

    - name: field_codice_fiscale
      label: "Il codice fiscale"
      selector: attributes/field_codice_fiscale

  ids:
    uuid:
      type: string
    uid:
      type: integer
    name:
      type: string

process:
  uuid:
    - plugin: skip_on_empty
      source: uuid
      method: process
  uid:
    - plugin: skip_on_empty
      source: uid
      method: process
  langcode:
    - plugin: skip_on_empty
      source: langcode
      method: process
  preferred_langcode:
    - plugin: skip_on_empty
      source: preferred_langcode
      method: process
  preferred_admin_langcode:
    - plugin: skip_on_empty
      source: preferred_admin_langcode
      method: process

  name:
    - plugin: skip_on_empty
      source: name
      method: process
  mail:
    - plugin: skip_on_empty
      source: mail
      method: process
  timezone:
    - plugin: skip_on_empty
      source: timezone
      method: process
  status:
    - plugin: skip_on_empty
      source: status
      method: process
  created:
    - plugin: skip_on_empty
      source: created
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: created
  changed:
    - plugin: skip_on_empty
      source: changed
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: changed
  access:
    - plugin: skip_on_empty
      source: access
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: access
  login:
    - plugin: skip_on_empty
      source: login
      method: process
    - plugin: format_date
      from_format: 'Y-m-d\TH:i:sP'
      to_format: 'U'
      source: login
  init:
    - plugin: skip_on_empty
      source: init
      method: process
  default_langcode: default_langcode

  field_codice_fiscale: field_codice_fiscale

destination:
  plugin: entity:user

migration_dependencies: { }
