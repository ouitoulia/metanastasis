langcode: it
status: true
dependencies:
  enforced:
    module:
      - marvasi_migration
id: mv_node_persona
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasi
  - node
  - node_persona
migration_group: marvasi_node
label: 'Tipo di contenuto Persona'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/marvasi_migration/artifact/node_persona.json'
  item_selector: 0
  fields:
    - name: nid
      label: "L'id del nodo"
      selector: nid
    - name: uid
      label: "L'utente proprietario"
      selector: uid
    - name: type
      label: "Il tipo"
      selector: type
    - name: title
      label: "Il titolo"
      selector: title
    - name: field_ritratto_url
      label: "L'url dell'avatar della persona"
      selector: field_ritratto_url
    - name: field_ritratto_alt
      label: "La descrizione dell'avatar"
      selector: field_ritratto_alt
    - name: field_nome
      label: "Il nome della persona"
      selector: field_nome
    - name: field_cognome
      label: "Il cognome della persona"
      selector: field_cognome
    - name: field_abstract
      label: "L'abstract"
      selector: field_abstract
    - name: field_telefono
      label: "Il telefono"
      selector: field_telefono
    - name: field_email
      label: "L'indirizzo o gli indirizzi email"
      selector: field_email
    - name: field_ruolo_persona
      label: "Il ruolo della persona"
      selector: field_ruolo_persona
    - name: field_tipologia_posto
      label: "Tipologia posto"
      selector: field_tipologia_posto
    - name: field_tipologia_incarico
      label: "Tipologia incarico"
      selector: field_tipologia_incarico
    - name: field_tipologia_supplenza
      label: "Tipologia supplenza"
      selector: field_tipologia_supplenza
    - name: field_data_fine
      label: "Data di fine incarico"
      selector: field_data_fine
    - name: field_materie
      label: "Materie insegnate"
      selector: field_materie
    - name: field_data_nascita
      label: "La data di nascita"
      selector: field_data_nascita
    - name: field_genere
      label: "Il genere della persona"
      selector: field_genere
    - name: field_codice_fiscale
      label: "Il codice fiscale"
      selector: field_codice_fiscale
    - name: langcode
      label: "La lingua dell'utente"
      selector: langcode
    - name: promote
      label: "Flag promote"
      selector: promote
    - name: sticky
      label: "Flag sticky"
      selector: sticky
    - name: status
      label: "Lo stato del nodo"
      selector: status
    - name: created
      label: "La data di creazione"
      selector: created
    - name: changed
      label: "La data di aggiornamento"
      selector: changed
    - name: uuid
      label: "L'uuid per riferimenti"
      selector: uuid

  ids:
    nid:
      type: integer
    uuid:
      type: string
  constants:
    ritratto_path: 'public://persona/ritratto/'

process:
  nid: nid
  uid: uid
  type: type
  title: title
  field_ritratto/target_id:
    plugin: file_import
    source: field_ritratto_url
    destination: constants/ritratto_path
    uid: uid
    file_exists: use_existing
    skip_on_missing_source: true
    id_only: true
  field_ritratto/alt: field_ritratto_alt
  field_nome: field_nome
  field_cognome: field_cognome
  field_abstract: field_abstract
  #field_telefono: field_telefono
  #field_email: field_email

  field_ruolo_persona:
    - plugin: static_map
      source: field_ruolo_persona
      bypass: true
      map:
        #1: # "anonimo" viene gestito dalla nuova installazione
        #2: # "autenticato" viene gestito dalla nuova installazione
        #3: # "administrator" viene gestito a mano
        #4: # "alunno" non vengono importati gli alunni
        5: 1711 # "Docente" -> "Personale Docente"
        #6: # "genitore" non vengono importati i genitori
        7: 1723 # "Segreteria" -> "Personale amministrativo"
        8: 1722 # "DSGA" -> "Direttore amministrativo (DSGA)"
        9: 1701 # "Preside" -> "Dirigente Scolastico"
        #10: # "Redattore" viene gestito a mano
        #11: # "Capo redattore" viene gestito a mano
        12: 1721 # "Collaboratore" -> "Personale non docente"
        #13: # "Intranet" viene gestito a mano
        14: 1732 # "Ex docente" -> "Ex docente"
        #15:
        #16:
        #17: # "Coordinatore" viene gestito a mano
        #18: # "Responsabile plesso" viene gestito a mano

  field_tipologia_posto: field_tipologia_posto

  field_tipologia_incarico:
    - plugin: static_map
      source: field_tipologia_incarico
      bypass: true
      map:
        270: 751
        271: 752

  field_tipologia_supplenza: field_tipologia_supplenza

  field_data_fine: field_data_fine

  field_materie:
    - plugin: skip_on_empty
      source: field_materie
      method: process
    - plugin: explode
      source: field_materie
      delimiter: ";"
    - plugin: callback
      callable: intval
    - plugin: static_map
      bypass: false
      map:
        # infanzia
        02: 2184 # "Italiano" -> "I discorsi e le parole"
        03: 2184 # "Inglese" -> "I discorsi e le parole"
        04: 2184 # "Francese" -> "I discorsi e le parole"
        05: 2185 # "Storia" -> "La conoscenza del mondo"
        06: 2185 # "Geografia" -> "La conoscenza del mondo"
        07: 2185 # "Matematica" -> "La conoscenza del mondo"
        08: 2181 # "Religione" -> "Il sé e l’altro"
        09: 2185 # "Scienze" -> "La conoscenza del mondo"
        10: 2183 # "Musica" -> "Immagini, suoni, colori"
        11: 2183 # "Arte e immagine" -> "Immagini, suoni, colori"
        12: 2182 # "Scienze motorie" -> "Il corpo e il movimento"
        13: 2185 # "Tecnologia" -> "La conoscenza del mondo"
        14: 2185 # "Approfondimento" -> "I discorsi e le parole"
        #15: 2115 # "Clarinetto" -> "Clarinetto"
        #16: 2122 # "Pianoforte" -> "Pianoforte"
        #17: 2121 # "Percussioni" -> "Percussioni"
        #18: 2125 # "Violino" -> "Violino"
        #90: # "Sostegno"
        203: 2185 # "Informatica" -> "La conoscenza del mondo"
        #204: # "Didattica"
        354: 2181 # "Educazione civica" -> "Il sé e l’altro"

        # primaria (arrivano con +1000)
        1002: 2151 # "Italiano" -> "Italiano"
        1003: 2152 # "Inglese" -> "Lingua inglese"
        #1004: 2108 # "Francese" -> "Francese"
        1005: 2153 # "Storia" -> "Storia"
        1006: 2154 # "Geografia" -> "Geografia"
        1007: 2155 # "Matematica" -> "Matematica"
        1008: 2161 # "Religione" -> "Religione"
        1009: 2156 # "Scienze" -> "Scienze"
        1010: 2157 # "Musica" -> "Musica"
        1011: 2158 # "Arte e immagine" -> "Arte e immagine"
        1012: 2159 # "Scienze motorie" -> "Educazione fisica"
        1013: 2160 # "Tecnologia" -> "Tecnologia"
        1014: 2151 # "Approfondimento" -> "Italiano"
        #1015: 2115 # "Clarinetto" -> "Clarinetto"
        #1016: 2122 # "Pianoforte" -> "Pianoforte"
        #1017: 2121 # "Percussioni" -> "Percussioni"
        #1018: 2125 # "Violino" -> "Violino"
        #1090: # "Sostegno"
        1203: 2160 # "Informatica" -> "Tecnologia"
        #1204: # "Didattica"
        1354: 2151 # "Educazione civica" -> "Italiano"

        # secondaria (arrivano con +2000)
        2002: 2102 # "Italiano" -> "Italiano, storia e geografia"
        2003: 2109 # "Inglese" -> "Inglese"
        2004: 2108 # "Francese" -> "Francese"
        2005: 2102 # "Storia" -> "Italiano, storia e geografia"
        2006: 2102 # "Geografia" -> "Italiano, storia e geografia"
        2007: 2103 # "Matematica" -> "Matematica e scienze"
        2008: 2127 # "Religione" -> "Religione"
        2009: 2103 # "Scienze" -> "Matematica e scienze"
        2010: 2104 # "Musica" -> "Musica"
        2011: 2101 # "Arte e immagine" -> "Arte e immagine"
        2012: 2105 # "Scienze motorie" -> "Scienze motorie"
        2013: 2106 # "Tecnologia" -> "Tecnologia"
        2014: 2102 # "Approfondimento" -> "Storia" -> "Italiano, storia e geografia"
        2015: 2115 # "Clarinetto" -> "Clarinetto"
        2016: 2122 # "Pianoforte" -> "Pianoforte"
        2017: 2121 # "Percussioni" -> "Percussioni"
        2018: 2125 # "Violino" -> "Violino"
        #2090: # "Sostegno"
        2203: 2106 # "Informatica" -> "Tecnologia"
        #2204: # "Didattica"
        2354: 2102 # "Educazione civica" -> "Italiano, storia e geografia"
    - plugin: log

  field_data_nascita: field_data_nascita
  field_genere: field_genere
  field_codice_fiscale: field_codice_fiscale
  langcode: langcode
  promote: promote
  sticky: sticky
  status: status
  created: created
  changed: changed

destination:
  plugin: 'entity:node'
  default_bundle: persona
  translations: true

migration_dependencies:
  required:
    - mv_users
