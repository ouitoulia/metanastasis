langcode: it
status: true
dependencies:
  enforced:
    module:
      - marvasi_migration
id: marvasi_files_managed
migration_tags:
  - marvasi
  - files
  - files_managed
migration_group: marvasi_files
label: 'Files gestiti da drupal'
source:
#  Mio custom plugin
#  plugin: dynamic_json_api
#  page:
#    base_url: 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file' # obbligatorio
#    limit: 5 # obbligatorio, elementi per pagina
#    max_offset: 0 # obbligatorio, numero massimo di risultati (tot = ~ max_offset + limit)
#    filter: # opzionale
#      -
#        name: 'sort[fid][direction]' # il nome della variabile get
#        value: 'ASC' # il valore
#      -
#        name: 'sort[fid][path]'
#        value: 'drupal_internal__fid'

  plugin: url
  data_fetcher_plugin: http
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  data_parser_plugin: json
  urls:
    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=0&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=50&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=100&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=150&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=200&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=250&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=300&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=350&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=400&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=450&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=500&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=550&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=600&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=650&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=700&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=750&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=800&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=850&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=900&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=950&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
#    - 'https://sync.icmarvasivizzone.edu.it/jsonapi/file/file?page[offset]=1000&page[limit]=50&sort[fid][direction]=ASC&sort[fid][langcode]&sort[fid][path]=drupal_internal__fid'
  item_selector: data
  fields:
    - name: uuid
      label: "L'uuid del file"
      selector: id
    - name: fid
      label: "Drupal internal fid"
      selector: attributes/drupal_internal__fid
    - name: langcode
      label: "La lingua del file"
      selector: attributes/langcode
    - name: uid
      label: "User id proprietario del file"
      selector: relationships/uid/data/meta/drupal_internal__target_id
    - name: filename
      label: "Il nome del file"
      selector: attributes/filename
    - name: uri_value
      label: "Percorso del file"
      selector: attributes/uri/value
    - name: filemime
      label: "MIME type"
      selector: attributes/filemime
    - name: filesize
      label: "Dimensione del file"
      selector: attributes/filesize
    - name: status
      label: "Stato del file"
      selector: attributes/status
    - name: created
      label: "Data di creazione"
      selector: attributes/created
    - name: changed
      label: "Data di modifica"
      selector: attributes/changed
  ids:
    uuid:
      type: string
    fid:
      type: integer

process:
  # fid: fid
  uuid:
    - plugin: log
      source: uuid
  langcode:
    - plugin: log
    - plugin: skip_on_empty
      source: langcode
      method: process
      default_value: "und"
  uid:
    - plugin: log
      source: uid
  filename:
    - plugin: log
      source: filename
  uri:
    - plugin: log
      source: uri_value
  filemime:
    - plugin: log
      source: filemime
  filesize:
    - plugin: log
      source: filesize
  status:
    - plugin: log
      source: status
  created:
    plugin: format_date
    from_format: 'Y-m-d\TH:i:sP'
    to_format: 'U'
    source: created
  changed:
    plugin: format_date
    from_format: 'Y-m-d\TH:i:sP'
    to_format: 'U'
    source: changed

destination:
  plugin: entity:file

migration_dependencies: { }

