langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_node_notizia
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasivizzone
  - node
  - node_notizia
migration_group: mv_nodes
label: 'Tipo di contenuto notizia'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/node_notizia.json'
  item_selector: 0
  fields:
    - name: nid
      label: 'ID del nodo'
      selector: migration_id
    - name: uuid
      label: 'UUID del nodo per referenza migrazione'
      selector: uuid
    - name: uid
      label: "L'UID del del proprietario del contenuto"
      selector: uid
    - name: type
      label: 'Il tipo di contenuto'
      selector: type
    - name: title
      label: 'Il titolo del contenuto'
      selector: title
    - name: field_tipologia_notizia
      label: 'Tipologia notizia'
      selector: field_tipologia_notizia
    - name: field_abstract
      label: 'Descrizione breve'
      selector: field_abstract
    - name: field_argomenti
      label: 'Argomenti'
      selector: field_argomenti
    - name: field_copertina
      label: 'Immagine di copertina'
      selector: field_copertina_media_id
    - name: body_value
      label: 'Corpo della notizia'
      selector: body_value
    - name: field_persone
      label: 'Gli autori della notizia'
      selector: field_persone
    - name: field_persona_responsabile
      label: "Le persone che parteciperanno all'evento"
      selector: field_persona_responsabile
    - name: field_luoghi
      label: 'I luoghi citati dalla notizia'
      selector: field_luoghi
    - name: field_eventi
      label: 'Gli eventi correlati'
      selector: field_eventi

    - name: field_paragraph_gallery
      label: 'Il paragraph gallery'
      selector: field_paragraph_gallery

    #field_paragraph_video
    #field_paragraph_allegati

    - name: langcode
      label: 'La lingua del contenuto'
      selector: langcode
    - name: promote
      label: 'Se il contenuto è promosso alla prima pagina'
      selector: promote
    - name: sticky
      label: 'Se il contenuto è in cima agli elenchi'
      selector: sticky
    - name: status
      label: 'Se il contenuto è pubblicato o meno'
      selector: status
    - name: created
      label: 'La data di pubblicazione'
      selector: created
    - name: changed
      label: 'La data di pubblicazione'
      selector: changed
  ids:
    nid:
      type: string
    uuid:
      type: string

process:
  #nid: nid
  uid: uid
  type: type
  title: title
  field_tipologia_notizia:
    plugin: skip_on_empty
    source: field_tipologia_notizia
    method: process

  # field_abstract: -> shared_configuration
  # field_argomenti: -> shared_configuration
  # field_copertina: -> shared_configuration
  # body/value: -> shared_configuration
  # body/format: -> shared_configuration
  # field_persone: -> shared_configuration
  # field_persona_responsabile: -> shared_configuration
  # field_luoghi: -> shared_configuration
  field_eventi:
    - plugin: skip_on_empty
      source: eventi
      method: process
    - plugin: sub_process
      source: eventi
      process:
        target_id: id

  field_extra_info:
    - plugin: skip_on_empty
      source: field_paragraph_gallery
      method: process
    - plugin: sub_process
      source: '@value'
      process:
        type:
          plugin: default_value
          default_value: gallery
        field_gallery_item:
          - plugin: explode
            source: field_paragraph_gallery
            delimiter: ";"
          - plugin: callback
            callable: intval
          - plugin: log
          - plugin: sub_process
            source: '@value'
            process:
              type:
                plugin: default_value
                default_value: gallery_item
              field_background_image:
                - plugin: log
                - plugin: migration_lookup
                  migration:
                    - mv_media_file # Assicura che questa migrazione gestisca i file
                  source: '@value' # Fid dal JSON
          - plugin: log




  #field_paragraph_video
  #field_paragraph_allegati

  # langcode: -> shared_configuration
  # promote: -> shared_configuration
  # sticky: -> shared_configuration
  status:
    plugin: default_value
    source: status
    default_value: 0
  # created: -> shared_configuration

destination:
  plugin: 'entity:node'
  default_bundle: article
  translations: true

migration_dependencies:
  required:
    - mv_user
    - mv_taxonomy_argomenti
    - mv_file
    - mv_media
    - mv_node_persona
    - mv_node_luogo
    - mv_struttura_organizzativa
