langcode: it
status: true
dependencies:
  enforced:
    module:
      - metanastasis
id: mv_file
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - json
  - marvasi
  - files
migration_group: mv_files
label: 'Importa i files da icmarvasivizzone.edu.it'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  headers:
    Accept: 'application/json; charset=utf-8'
    Content-Type: application/json
  urls:
    - 'https://marvasi-migration.ddev.site/modules/custom/metanastasis/artifact/file.json'
  item_selector: 0
  fields:
    - name: fid
      label: "Id del file"
      selector: fid
    - name: uuid
      label: "Uuid del file"
      selector: uuid
    - name: langcode
      label: "La lingua del file"
      selector: langcode
    - name: uid
      label: "L'id utente proprietario del file"
      selector: uid
    - name: filename
      label: "Il nome del file"
      selector: filename
    - name: uri
      label: "Il percorso di sistema"
      selector: uri
    - name: filemime
      label: "Il filemime del file"
      selector: filemime
    - name: filesize
      label: "La dimensione del file"
      selector: filesize
    - name: status
      label: "Lo stato del file"
      selector: status
    - name: created
      label: "Da data di creazione"
      selector: created
    - name: changed
      label: "La data di aggiornamento"
      selector: changed
  ids:
    fid:
      type: integer
    uuid:
      type: string

process:
  fid: fid
  langcode: langcode
  uid: uid
  filename: filename
  uri: uri
  filemime: filemime
  filesize: filesize
  status: status
  created: created
  changed: changed

destination:
  plugin: entity:file
  translations: true

migration_dependencies:
  required:
    - mv_user
